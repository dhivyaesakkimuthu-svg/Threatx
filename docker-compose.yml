version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: threatx_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threatx_db
    volumes:
      - threatx_mongo_data:/data/db
    networks:
      - threatx_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python Simulated Target & Telemetry Engine
  demo-server:
    build:
      context: .
      dockerfile: demo-server/Dockerfile
    container_name: threatx_demo_server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOST=0.0.0.0
    networks:
      - threatx_network

  # 3. ThreatX Central Express API Gateway
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: threatx_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - THREATX_VERSION=1.0.0
      - DEMO_MODE=true
      - MONGODB_URI=mongodb://mongodb:27017/threatx_db
      - DEMO_SERVER_URL=http://demo-server:5001
      - JWT_SECRET=threatx_soc_super_secret_production_key_change_in_prod_2026
      - JWT_EXPIRES_IN=8h
      - CLIENT_URL=http://localhost:5173
      - ADMIN_EMAIL=admin@threatx.io
      - ADMIN_PASSWORD=Admin@ThreatX2026!
    depends_on:
      mongodb:
        condition: service_healthy
      demo-server:
        condition: service_started
    networks:
      - threatx_network

  # 4. ThreatX React SOC Frontend Console
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: threatx_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - threatx_network

networks:
  threatx_network:
    driver: bridge

volumes:
  threatx_mongo_data:
